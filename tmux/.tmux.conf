set -g mouse on

# open new panes/windows in the same directory as the current pane
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# enable truecolor / 24-bit color support (needed for starship prompt)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -as terminal-features ",*:RGB"

# --- clipboard over SSH (OSC 52) ---
# Let tmux copy the selection out to the client terminal's clipboard via
# the OSC 52 escape sequence, so mouse-selected text is available for
# pasting outside tmux (e.g. Ctrl+V in your local terminal/apps), even
# over SSH with no X11/Wayland on this host.
set -g set-clipboard on
set -as terminal-features ",*:clipboard"

# when you release the mouse after selecting, copy to buffer AND send OSC 52
unbind -T copy-mode-vi MouseDragEnd1Pane
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

